name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel old runs on the same PR; main pushes always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # `python/ogentic-audit-py` is a PyO3 cdylib — built via maturin in the
  # python-test job, not via `cargo test --workspace`. Excluded from
  # workspace-wide cargo invocations on jobs that don't install Python.
  WORKSPACE_EXCLUDE: --exclude ogentic-audit-py

jobs:
  # ----------------------------------------------------------------
  # Rust: build + test on stable + MSRV across macOS, Linux, Windows.
  # ----------------------------------------------------------------
  rust-test:
    name: rust-test (${{ matrix.os }} / ${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, "1.91"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2025-06-09 — see OGE-837
        with:
          toolchain: ${{ matrix.toolchain }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 — pinned per OGE-837
        with:
          shared-key: rust-test-${{ matrix.toolchain }}
          # Per-OS cache key avoids cross-platform cache pollution.
          key: ${{ matrix.os }}

      - name: cargo build (locked)
        run: cargo build --workspace ${{ env.WORKSPACE_EXCLUDE }} --all-features --locked

      - name: cargo test (locked)
        run: cargo test --workspace ${{ env.WORKSPACE_EXCLUDE }} --all-features --locked

      # ogentic-audit-kms exposes a `KmsProvider` trait + `KmsKey` type
      # that compile WITHOUT the `aws` feature (no AWS SDK pulled in).
      # OGE-460 AC: "Desktop and CLI builds compile and test green with
      # the feature disabled (verified by an explicit
      # `--no-default-features` matrix entry in CI)". This step proves
      # the no-SDK compile path before GCP/Azure providers (OGE-603)
      # arrive under separate feature flags.
      - name: cargo build (kms crate, --no-default-features)
        run: cargo build -p ogentic-audit-kms --no-default-features --locked

      # Doctests in `lib.rs` deliberately exercise the AWS quickstart
      # surface — they only compile under the `aws` feature. Use --lib
      # + --tests (not --doc) so we cover unit + integration tests
      # without the doctest harness picking up the AWS-only example.
      - name: cargo test  (kms crate, --no-default-features, lib+tests only)
        run: cargo test  -p ogentic-audit-kms --no-default-features --locked --lib --tests

  # ----------------------------------------------------------------
  # Rust: clippy + rustfmt. Uses stable; MSRV is exercised by rust-test.
  # ----------------------------------------------------------------
  rust-lint:
    name: rust-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2025-06-09 — see OGE-837
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 — pinned per OGE-837
        with:
          shared-key: rust-lint

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace ${{ env.WORKSPACE_EXCLUDE }} --all-targets --all-features -- -D warnings

      - name: cargo doc (no missing-docs warnings)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace ${{ env.WORKSPACE_EXCLUDE }} --no-deps --all-features

  # ----------------------------------------------------------------
  # Rust: cargo-audit (advisory DB) + cargo-deny (licenses + advisories
  # + sources + bans). Runs daily on `main` via the schedule below so
  # newly-published advisories get noticed even without a PR.
  # ----------------------------------------------------------------
  rust-security:
    name: rust-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2025-06-09 — see OGE-837

      - name: cargo audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0 — pinned per OGE-837
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2 — pinned per OGE-837
        with:
          log-level: warn
          command: check
          arguments: --all-features

  # ----------------------------------------------------------------
  # Python: pytest against a maturin-built native extension.
  # ----------------------------------------------------------------
  python-test:
    name: python-test (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2025-06-09 — see OGE-837

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 — pinned per OGE-837
        with:
          shared-key: python-test
          # The maturin develop step builds against the chosen Python
          # ABI. abi3-py39 means one wheel per Python is unnecessary,
          # but the matrix still validates each interpreter loads it.
          key: py-${{ matrix.python }}

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # maturin develop requires an active virtualenv. Create one and
      # wire it into PATH/VIRTUAL_ENV so subsequent steps inherit it.
      - name: Create virtualenv
        run: |
          python -m venv .venv
          echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=${{ github.workspace }}/.venv" >> "$GITHUB_ENV"

      - name: Install build + test deps
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest

      - name: maturin develop
        run: maturin develop --release

      - name: pytest
        run: pytest python/tests -v

  # ----------------------------------------------------------------
  # Python: ruff lint + format check. Cheap; runs on every push.
  # ----------------------------------------------------------------
  python-lint:
    name: python-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install "ruff>=0.4"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  # ----------------------------------------------------------------
  # Python: pip-audit on the build + dev dependency set.
  # ----------------------------------------------------------------
  python-security:
    name: python-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # Audit the dev extras as installed (matches pyproject.toml's
      # [project.optional-dependencies].dev set). Project runtime deps
      # are sparse at v0.1; this catches transitive advisories in the
      # build + test toolchain that would land in user environments
      # via `pip install ogentic-audit[dev]`.
      - name: Install dev extras + pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit \
            "pytest>=7.0" "pytest-cov>=4.0" \
            "ruff>=0.4" "mypy>=1.8" "maturin>=1.5"

      - name: pip-audit (current env)
        run: pip-audit --strict

  # ----------------------------------------------------------------
  # Vector conformance: enforce that committed v0.1 golden vectors
  # are byte-for-byte what the reference generator produces today,
  # and that cbor2 canonical-form parity still holds (1014 payloads).
  # This is the load-bearing quality gate while the Rust core hasn't
  # landed — it's what catches accidental spec drift in PRs that
  # touch tools/gen_vectors.py or the schema.
  # ----------------------------------------------------------------
  vector-conformance:
    name: vector-conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install blake3 cbor2

      - name: gen_vectors --check (no drift)
        run: python3 tools/gen_vectors.py --check

      - name: check_cbor_parity (cbor2 round-trip)
        run: python3 tools/check_cbor_parity.py

  # ----------------------------------------------------------------
  # Keychain integration — real OS secret stores (OGE-478 / OGE-431 AC 7).
  #
  # The `rust-test` matrix only COMPILES the keychain backend on each OS.
  # These jobs exercise store/load/load_or_generate/delete against the
  # actual Keychain / Secret Service / Credential Manager.
  #
  # The integration tests skip unless `OGENTIC_KEYCHAIN_CI=1` (so a
  # developer's `cargo test` never touches their real login keychain);
  # each job below provisions an ephemeral, unlocked store and sets that
  # variable. `--test-threads=1` is required: the tests share one real OS
  # store, and the platform Security frameworks are not reliable under
  # concurrent add/find/delete on the same store.
  # ----------------------------------------------------------------
  keychain-integration-macos:
    name: keychain-integration (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2025-06-09 — see OGE-837
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 — pinned per OGE-837
        with:
          shared-key: keychain-macos

      # keyring 3.x could not round-trip on macOS from an unsigned cargo
      # binary (OGE-478); keyring 4.x can, and the round-trip needs the
      # test store to be the SOLE keychain in the user search list — a
      # login keychain also present in the list made lookups ambiguous.
      # So: create an ephemeral keychain, make it the entire search list,
      # and promote it to the user default (which keyring reads).
      - name: Provision an ephemeral login keychain
        run: |
          KC="$RUNNER_TEMP/ogentic-audit-it.keychain"
          security create-keychain -p "" "$KC"
          security set-keychain-settings "$KC"          # no auto-lock timeout
          security unlock-keychain -p "" "$KC"
          security list-keychains -d user -s "$KC"      # SOLE keychain in the search list
          security default-keychain -d user -s "$KC"
          echo "OGENTIC_AUDIT_IT_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Keychain integration tests
        env:
          OGENTIC_KEYCHAIN_CI: "1"
        run: cargo test -p ogentic-audit-keychain --all-features --locked -- --test-threads=1 macos_integration

      # Isolation guarantee: nothing the suite wrote may survive in the
      # real user login keychain. (The ephemeral keychain is discarded
      # with the runner; this asserts we never wrote past it.)
      - name: Assert no leak into the login keychain
        run: |
          if security find-generic-password -s "com.ogenticai.ogentic-audit.test" "$HOME/Library/Keychains/login.keychain-db" >/dev/null 2>&1; then
            echo "::error::test entries leaked into the login keychain"; exit 1
          fi
          echo "no leak into login keychain"

  keychain-integration-linux:
    name: keychain-integration (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2025-06-09 — see OGE-837
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 — pinned per OGE-837
        with:
          shared-key: keychain-linux

      # keyring 4's v1 Secret-Service store is the pure-Rust zbus client,
      # so no libdbus/libsecret system package is needed — only a running
      # Secret Service (gnome-keyring) on a session bus.
      - name: Install GNOME Keyring + D-Bus
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring dbus-x11

      # Bring up the Secret Service the way keyring-rs's own CI does:
      # inside a private session bus, feed a passphrase to
      # `gnome-keyring-daemon --unlock` (which creates + unlocks a fresh
      # "login" collection and forks the daemon). The `org.freedesktop.secrets`
      # service is D-Bus-activated on the first call, so no manual
      # backgrounding / sleep race. An earlier attempt used an empty
      # passphrase + `& sleep 2`, which left the service unregistered and
      # failed with `NoStorageAccess(NoResult)`.
      #
      # The passphrase is a throwaway for this ephemeral runner only —
      # NOT a deployment pattern. Production Sotto Desktop uses a
      # user-chosen passphrase.
      - name: Build tests (outside the keyring session, to avoid daemon timeout)
        run: cargo build -p ogentic-audit-keychain --all-features --locked --tests

      - name: Start a session bus + unlock a fresh keyring, then run tests
        env:
          OGENTIC_KEYCHAIN_CI: "1"
        run: |
          rm -rf "$HOME/.local/share/keyrings"
          dbus-run-session -- bash -euxc '
            echo "ci-throwaway-passphrase" | gnome-keyring-daemon --unlock
            cargo test -p ogentic-audit-keychain --all-features --locked -- --test-threads=1 linux_integration
          '

  keychain-integration-windows:
    name: keychain-integration (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2025-06-09 — see OGE-837
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 — pinned per OGE-837
        with:
          shared-key: keychain-windows

      # Credential Manager is per-user; the runner user's logon session
      # can write to it with no admin elevation and no code signing. If
      # this job ever fails with a Credential Manager access error, the
      # documented fallback is an Authenticode-signed test binary via the
      # OGE-439 release-signing infra, restricted to release-tag CI.
      - name: Keychain integration tests
        env:
          OGENTIC_KEYCHAIN_CI: "1"
        run: cargo test -p ogentic-audit-keychain --all-features --locked -- --test-threads=1 windows_integration

  # ----------------------------------------------------------------
  # Conventional Commits on PR titles. Skipped on push to main since
  # squash-merge titles are validated at merge time via the PR.
  # ----------------------------------------------------------------
  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install commitlint
        run: |
          npm install --no-save \
            @commitlint/cli@^19 \
            @commitlint/config-conventional@^19

      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx commitlint --config .commitlintrc.json

      - name: Lint commit messages on the branch
        run: npx commitlint --config .commitlintrc.json --from origin/${{ github.base_ref }} --to HEAD

  # ----------------------------------------------------------------
  # Coverage: cargo-llvm-cov for Rust + pytest-cov for Python.
  # Uploads to Codecov when CODECOV_TOKEN is configured; absence of
  # the token does not fail the job.
  #
  # The 80% gate from OGE-442 is enforced post-v0.1.0 once R1/R2/R3
  # land real code. While the crates are stubs, coverage is high but
  # uninformative — the threshold is documented but not enforced yet
  # (see closeout note on the ticket).
  # ----------------------------------------------------------------
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2025-06-09 — see OGE-837
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 — pinned per OGE-837
        with:
          shared-key: coverage

      - uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2 — pinned per OGE-837
        with:
          tool: cargo-llvm-cov

      - name: Rust coverage
        run: cargo llvm-cov --workspace ${{ env.WORKSPACE_EXCLUDE }} --all-features --lcov --output-path lcov.info

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Create virtualenv
        run: |
          python -m venv .venv
          echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=${{ github.workspace }}/.venv" >> "$GITHUB_ENV"

      - run: pip install --upgrade pip maturin pytest pytest-cov

      - name: maturin develop
        run: maturin develop --release

      - name: Python coverage
        run: pytest python/tests --cov=ogentic_audit --cov-report=xml:coverage.xml || true

      - name: Upload to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5 — pinned per OGE-837
        with:
          files: lcov.info,coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true
