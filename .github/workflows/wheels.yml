# Python wheels — manylinux + macOS arm64/x86_64 + Windows x86_64
# (OGE-434 / P2).
#
# Two trigger surfaces:
#
# * Pushed tags `v*` → build wheels + sdist for every (OS, arch, Python)
#   combination in the matrix, then publish to PyPI via a **Trusted
#   Publisher** (OIDC) — no token stored anywhere. The publisher on PyPI
#   is bound to this repo, this workflow (`wheels.yml`), and the `pypi`
#   environment; each run mints a short-lived OIDC token.
#
# * Manual `workflow_dispatch` → build everything, upload as a GitHub
#   Actions artifact, but skip the PyPI publish step (gated on a tag ref).
#   Use this to validate all wheel legs before tagging a release.
#
# The wheels are built via `cibuildwheel` driving `maturin`'s build
# backend. `pyo3 = { ..., features = ["abi3-py39"] }` in the workspace
# Cargo.toml means each platform / arch ships ONE wheel that loads on
# every supported CPython 3.9+ — the matrix below builds with Python
# 3.12 as the build interpreter (cibuildwheel picks up the abi3 tag
# from pyproject.toml's `tool.maturin` block) and the result is
# `abi3-py39` for every platform.
#
# Prerequisites (one-time, on the PyPI + GitHub side):
#
#   1. A PyPI Trusted Publisher for `ogentic-audit`: owner `OgenticAI`,
#      repo `ogentic-audit`, workflow `wheels.yml`, environment `pypi`.
#      For the first-ever upload use a *pending* publisher (PyPI →
#      Publishing) since the project does not exist yet. No token needed.
#   2. Repo Environment `pypi` exists (Settings → Environments). Its name
#      must match the publisher config and the `environment:` block below.

name: wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------
  # Build wheels for every (OS, arch) target.
  # ----------------------------------------------------------------
  build-wheels:
    name: wheels (${{ matrix.os }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runs-on: ubuntu-latest
            cibw_archs: x86_64
          - os: linux
            arch: aarch64
            runs-on: ubuntu-24.04-arm
            cibw_archs: aarch64
          # Both macOS arches build on Apple Silicon (macos-14) — arm64
          # natively, x86_64 cross-compiled — replacing the retired macos-13
          # Intel leg. Kept as two single-arch jobs so each carries its own
          # MACOSX_DEPLOYMENT_TARGET: arm64 macOS starts at 11.0, while Rust's
          # x86_64-apple-darwin std targets 10.12, and cibuildwheel's x86_64
          # default of 10.9 made delocate reject the wheel (OGE-1407).
          - os: macos
            arch: arm64
            runs-on: macos-14
            cibw_archs: arm64
            macosx_target: "11.0"
          - os: macos
            arch: x86_64
            runs-on: macos-14
            cibw_archs: x86_64
            macosx_target: "10.12"
          - os: windows
            arch: x86_64
            runs-on: windows-latest
            cibw_archs: AMD64

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable — pinned per OGE-837

      # macOS builds both arches on Apple Silicon: install the x86_64
      # target so maturin can cross-compile the Intel wheel.
      - name: Add x86_64 Rust target (macOS cross-build)
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@f03ac7617d6cff873ccf24cc0d567ef5ba5a9e6d # v2.21.3 — pinned per OGE-837
        env:
          # abi3 wheels cover every supported CPython once built.
          # We still iterate one build per ABI tag, but cibuildwheel
          # produces a single wheel under `tool.maturin`'s abi3-py39
          # config.
          CIBW_BUILD: "cp39-*"
          CIBW_SKIP: "*-musllinux*"
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          # Per-arch macOS deployment target (empty / ignored off macOS).
          # Both maturin (Rust min-version) and cibuildwheel (wheel tag)
          # read this, so the tag and the binary agree and delocate passes.
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=${{ matrix.macosx_target }}
          # manylinux_2_28 — matches the abi3-py39 baseline.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          # cibuildwheel needs to know to use maturin's build backend.
          CIBW_BUILD_FRONTEND: "build"
          # Rust on the build host: install rustup inside the manylinux
          # container so maturin can build the cdylib.
          CIBW_BEFORE_ALL_LINUX: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
              sh -s -- -y --profile minimal --default-toolchain stable
            source "$HOME/.cargo/env"
            rustup show
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH"'
          # Smoke-test: import + run the format_version helper.
          CIBW_TEST_REQUIRES: "pytest"
          CIBW_TEST_COMMAND: 'python -c "import ogentic_audit; assert ogentic_audit.format_version() == 0x0001"'
          # The Intel wheel is cross-built on Apple Silicon, so it cannot
          # be executed on the arm64 runner — build it, skip its test.
          CIBW_TEST_SKIP: "*-macosx_x86_64"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  # ----------------------------------------------------------------
  # Build the sdist (source distribution).
  # ----------------------------------------------------------------
  build-sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable — pinned per OGE-837

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install maturin

      - name: Build sdist
        run: maturin sdist --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ----------------------------------------------------------------
  # Publish to PyPI via Trusted Publishers. Tag pushes only.
  # ----------------------------------------------------------------
  publish-to-pypi:
    name: publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # PyPI Trusted Publisher (OIDC) — no token stored anywhere. The
    # publisher on PyPI is bound to this repo + workflow + `pypi`
    # environment; the short-lived OIDC token is minted per-run.
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/ogentic-audit
    steps:
      - uses: actions/download-artifact@v8
        with:
          # Pull every wheels-* artifact + sdist into ./dist
          path: artifacts
          pattern: "wheels-*"
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: artifacts

      - name: Flatten into ./dist
        run: |
          mkdir -p dist
          find artifacts -type f \( -name "*.whl" -o -name "*.tar.gz" \) -exec cp {} dist/ \;
          ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0 (release/v1 HEAD) — pinned per OGE-837
        with:
          # Trusted Publisher (OIDC): no user/password. The action mints a
          # short-lived OIDC token that PyPI trades for an upload token,
          # scoped to this exact repo + workflow + environment.
          packages-dir: dist/
          skip-existing: true   # re-runs skip already-live files (e.g. re-upload a fixed sdist)
          verbose: true
