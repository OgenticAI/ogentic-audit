# Release orchestrator (OGE-445 / D3).
#
# Triggered by `v*` tag push ONLY. Runs `cargo publish` for the three
# Rust crates in dependency order. The Python wheels + CLI binaries
# pipelines (wheels.yml / release-cli.yml) trigger on the same tag
# and run independently — PyPI + crates.io + GitHub Release are
# independent registries so order doesn't matter.
#
# Single tag → three fan-outs:
#
#   wheels.yml        →  PyPI publish (Trusted Publishers)
#   release-cli.yml   →  GitHub Release with signed CLI binaries
#   release.yml       →  cargo publish to crates.io  (this file)
#
# `workflow_dispatch` is intentionally NOT a trigger here: crates.io
# publishes are immutable, and we want the only path to `cargo publish`
# to be a signed tag pointing at a reviewed commit. Manually dispatching
# a publish from any branch (including a backdoored one with the same
# `0.1.0` version) would let a contributor with write access poison
# users running `cargo install ogentic-audit`. The cosign-verify-blob
# recipe in README only covers the GitHub Release tarball, not the
# crates.io distribution channel, so the trigger surface is the gate.
# See OGE-834.
#
# Required secrets (one-time, on repo Settings → Secrets):
#   CARGO_REGISTRY_TOKEN  crates.io publish token

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish-crates:
    name: cargo publish (crates.io)
    runs-on: ubuntu-latest
    # Defense-in-depth: even though `push: tags: ["v*"]` is the only
    # trigger, gate the publish steps on the ref being a tag — so any
    # future trigger added by mistake still cannot publish from a branch.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable — pinned per OGE-837

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2 — pinned per OGE-837
        with:
          shared-key: release-crates

      # Publish in dependency order. ogentic-audit-core has no
      # internal deps; keychain + cli both depend on core.
      #
      # `cargo publish` blocks until crates.io's index updates the
      # crate listing — typically ~30 seconds. We add a sleep
      # between publishes to let the previous crate's metadata land
      # in the index before the next crate tries to resolve it.

      - name: publish ogentic-audit-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish --package ogentic-audit-core --locked
          sleep 30  # give the crates.io index time to propagate

      - name: publish ogentic-audit-keychain
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish --package ogentic-audit-keychain --locked
          sleep 30

      - name: publish ogentic-audit
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish --package ogentic-audit --locked

  # No post-publish badge-bump job (removed per OGE-1751).
  #
  # The version badges in README.md are already dynamic shields —
  # `img.shields.io/crates/v/ogentic-audit-core` and
  # `img.shields.io/pypi/v/ogentic-audit` re-render themselves the moment
  # a new version lands on crates.io / PyPI, so there is nothing to commit
  # after a release. The only static version-like badge is the on-disk
  # *format* badge (`on--disk format-v0.1`), which is deliberately frozen
  # at the format version (`0x0001` / v0.1) and must NOT track the library
  # version. The old job rewrote exactly that badge to the library version
  # (corrupting it) and its `gh pr create` step failed under the default
  # GITHUB_TOKEN, marking an otherwise-successful publish run as "failure"
  # and leaving an orphan `release/post-*-badge-bump` branch. Nothing here
  # needs a post-publish commit, so the job is gone rather than repaired.
